<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Apresentação — EME Select</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #F3EFE5; color: #173C32; }
    body { margin: 0; min-height: 100vh; font: 15px Arial, sans-serif; }
    main { width: min(100%, 1720px); margin: 0 auto; padding: 28px clamp(16px, 4vw, 70px); }
    header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 22px; }
    h1 { font-size: 14px; font-weight: 400; letter-spacing: .13em; text-transform: uppercase; margin: 0; }
    a, button { color: inherit; font: inherit; }
    a { text-underline-offset: 5px; }
    button { border: 1px solid #173C32; border-radius: 999px; padding: 12px 21px; background: transparent; cursor: pointer; }
    button.primary { background: #173C32; color: #F3EFE5; min-width: 134px; }
    button:hover { background: #D9D3C5; color: #173C32; }
    button:disabled { opacity: .5; cursor: default; }
    a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #536D60; outline-offset: 5px; }
    #stage { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border: 1px solid #D9D3C5; background: #F3EFE5; }
    #composition { display: block; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; }
    .controls { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
    #progress { accent-color: #173C32; width: min(280px, 50vw); min-height: 32px; cursor: pointer; }
    #status { text-align: center; color: #536D60; min-height: 20px; line-height: 1.5; margin: 17px 0 0; }
    .description { text-align: center; font: 400 clamp(23px, 3vw, 42px)/1.3 Georgia, serif; margin: 30px auto 0; max-width: 640px; }
    @media(max-width: 600px) { main { padding-top: 20px; } .description { margin-top: 22px; } header { align-items: flex-start; } .controls { gap: 10px; } }
  </style>
</head>
<body>
  <main>
    <header><h1>Uma apresentação EME Select</h1><a id="return-link" href="/" target="_top">Voltar à coleção</a></header>
    <div id="stage"><iframe id="composition" src="index.html" title="Marca EME Select sendo revelada em uma composição de dobras" tabindex="-1"></iframe></div>
    <div class="controls" aria-label="Controles da apresentação">
      <button type="button" class="primary" id="play" disabled>Reproduzir</button>
      <button type="button" id="replay" disabled>Recomeçar</button>
      <input id="progress" type="range" min="0" max="4.8" step="0.01" value="4.8" aria-label="Posição da apresentação" disabled>
    </div>
    <p id="status" role="status">Preparando a apresentação.</p>
    <p class="description">Seu próximo lugar. Uma escolha especial.</p>
  </main>
  <script src="preview.js"></script>
</body>
</html>
